<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Kalam:wght@700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 92% 10%, rgba(124, 58, 237, 0.12), transparent 360px),
          linear-gradient(180deg, #f8fafc 0%, #f8fafc 56%, rgba(221, 214, 254, 0.78) 100%);
        color: #0f172a;
        font-family: Inter, system-ui, sans-serif;
      }
      .frame {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 360px 1fr;
      }
      aside {
        margin: 24px 0 24px 52px;
        padding: 38px 28px 24px;
        width: 312px;
        border-radius: 34px;
        background: rgba(255, 255, 255, 0.74);
        border: 1px solid rgba(255, 255, 255, 0.75);
        box-shadow: 0 28px 70px rgba(148, 163, 184, 0.15);
      }
      .brand-kicker {
        color: #64748b;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.22em;
      }
      .brand-title {
        margin-top: 8px;
        font-family: Kalam, cursive;
        font-size: 34px;
        font-weight: 700;
      }
      .brand-subtitle {
        margin-top: 12px;
        color: #64748b;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.24em;
      }
      nav {
        display: grid;
        gap: 18px;
        margin-top: 58px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 20px;
        height: 64px;
        padding: 0 22px;
        border-radius: 24px;
        color: #64748b;
        font-size: 17px;
        font-weight: 800;
      }
      .nav-item.active {
        background: #7c3aed;
        color: white;
        box-shadow: 0 20px 45px rgba(124, 58, 237, 0.24);
      }
      .nav-icon {
        width: 24px;
        height: 24px;
        border: 2px solid currentColor;
        border-radius: 8px;
      }
      main {
        position: relative;
        padding: 148px 86px 72px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .pill {
        margin-top: 28px;
        padding: 12px 20px;
        border-radius: 999px;
        color: #64748b;
        background: rgba(255, 255, 255, 0.76);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 12px 28px rgba(148, 163, 184, 0.18);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .pill::before {
        content: "";
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 10px;
        border-radius: 999px;
        background: #7c3aed;
      }
      h1 {
        margin: 34px 0 0;
        max-width: 980px;
        text-align: center;
        font-family: Kalam, cursive;
        font-size: 98px;
        line-height: 0.95;
        letter-spacing: 0;
      }
      h1 span {
        color: #7c3aed;
        display: block;
        font-size: 110px;
      }
      .intro {
        margin: 34px 0 0;
        max-width: 780px;
        color: #64748b;
        text-align: center;
        font-size: 21px;
        line-height: 1.7;
        font-weight: 600;
      }
      .actions {
        display: flex;
        gap: 22px;
        margin-top: 42px;
      }
      .button {
        min-width: 300px;
        height: 74px;
        display: grid;
        place-items: center;
        border-radius: 24px;
        font-size: 21px;
        font-weight: 800;
      }
      .button.primary {
        color: white;
        background: #11183d;
        box-shadow: 0 26px 54px rgba(15, 23, 42, 0.16);
      }
      .button.secondary {
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(226, 232, 240, 0.95);
        box-shadow: 0 16px 36px rgba(148, 163, 184, 0.13);
      }
      .flow-title {
        margin-top: 128px;
        font-size: 56px;
        font-weight: 500;
        letter-spacing: 0;
      }
      .features {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 70px;
        margin-top: 70px;
        padding: 0 84px;
        text-align: center;
      }
      .feature-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 14px 34px rgba(148, 163, 184, 0.16);
      }
      .feature h3 {
        margin: 0;
        font-size: 22px;
      }
      .feature p {
        color: #64748b;
        font-size: 16px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <aside>
        <div class="brand-kicker">金 牌 导 师 AI</div>
        <div class="brand-title">MG. AI</div>
        <div class="brand-subtitle">学 生 学 习 空 间</div>
        <nav>
          <div class="nav-item active"><span class="nav-icon"></span>学习看板</div>
          <div class="nav-item"><span class="nav-icon"></span>AI新闻</div>
          <div class="nav-item"><span class="nav-icon"></span>AI导师</div>
          <div class="nav-item"><span class="nav-icon"></span>能力训练</div>
          <div class="nav-item"><span class="nav-icon"></span>模拟面试</div>
          <div class="nav-item"><span class="nav-icon"></span>成长记录</div>
        </nav>
      </aside>
      <main>
        <div class="pill">金牌导师陪练新标准</div>
        <h1>把金牌导师，<span>带到每一次练习里。</span></h1>
        <p class="intro">用更自然的方式完成问答辅导、专项练习和模拟面试。像真的导师陪你拆题、追问、复盘，而不是只给你一堆冰冷答案。</p>
        <div class="actions">
          <div class="button primary">进入金牌导师</div>
          <div class="button secondary">开始专项练习</div>
        </div>
        <div class="flow-title">学习流程，更轻更顺。</div>
        <div class="features">
          <div class="feature"><div class="feature-icon"></div><h3>更像真人导师</h3><p>会追问、会引导、会复盘，帮你把答案讲清楚。</p></div>
          <div class="feature"><div class="feature-icon"></div><h3>训练路径更完整</h3><p>从知识问答到练习刷题，再到模拟面试。</p></div>
          <div class="feature"><div class="feature-icon"></div><h3>金牌导师视角</h3><p>以导师式表达标准来要求你，帮助你更快建立结构化思维。</p></div>
        </div>
      </main>
    </div>
  </body>
</html>
